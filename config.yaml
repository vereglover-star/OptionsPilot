# OptionsPilot user configuration.
# Anything omitted falls back to safe defaults (see docs/ARCHITECTURE.md §2.11).
# Environment variables override this file: OPTIONSPILOT__RISK__RISK_PER_TRADE_PCT=0.5

data:
  provider: yfinance
  watchlist: [SPY, QQQ, AAPL, NVDA, TSLA]
  timeframes: [1d, 4h, 1h, 15m, 5m]

# Market-data subsystem: how price history is FETCHED. Nothing here changes what
# is traded — only which sources are used, how hard they are tried, and how the
# results are cached and logged. Every key below is optional; the whole section
# can be deleted and the shipped chain (Yahoo JSON -> yfinance -> Stooq) behaves
# exactly as it does today. Full reference: docs/MARKET_DATA.md section 16.
#
# MOST OF THIS IS NOW EDITABLE IN THE APP: Settings > Market data lets you add
# API keys, reorder providers, switch them on and off, test connections and run
# maintenance — no file editing and no restart. Those choices persist to
# <data>/marketdata.json and <data>/credentials.json and take precedence over
# this section. Edit here for things the UI does not expose (timeouts, retries,
# breaker thresholds) or to pin a configuration for a deployment.
#
# market_data:
#   # How the provider chain is ORDERED. Three modes, explained in the UI:
#   #   static   ask in exactly the configured order; health is ignored for
#   #            ordering (an unusable provider is still skipped)
#   #   hybrid   your order stands, and a provider only loses its place when it
#   #            is genuinely FAILING — not when it is merely slower
#   #   dynamic  fastest healthy provider per request (the default)
#   ordering_mode: dynamic
#   # Your explicit order, best first. Normally written by Settings > Market
#   # data. Unknown names are ignored, so a config survives a downgrade.
#   provider_order: []
#   # The older spelling of "static", kept because existing configs set it.
#   # false STILL WINS over ordering_mode: someone who turned ranking off did so
#   # deliberately and must not be overruled by a newer field.
#   dynamic_ranking: true
#   memo_max_entries: 400        # in-memory frames (symbol x timeframe x session)
#   structured_logging: true     # one key=value line per request in logs/data.log
#
#   # Let providers measure their own history depth in the background. OFF by
#   # default: the shipped table in data/capabilities.py is measured, sits one
#   # day inside each real cliff on purpose, and a probe costs real requests.
#   capability_discovery: false
#   capability_refresh_days: 30
#
#   cache:
#     enabled: true
#     retention_days: null       # null keeps everything (a deep cache is the
#                                # last tier before a blank chart)
#     warn_bytes: 536870912      # log a warning past 512 MB
#
#   # Where daily request counts persist, so restarting the app cannot mint an
#   # allowance a plan never granted. Defaults to <data>/quota.json.
#   quota_state_path: null
#   # Where API keys pasted into Settings are stored (owner-only, and the ONLY
#   # file in the app that holds a secret), and where the control centre's live
#   # choices persist. Default to <data>/credentials.json and
#   # <data>/marketdata.json. null keeps both in memory only.
#   credentials_path: null
#   control_state_path: null
#
#   # Developer fault injection: temporarily break a provider on demand to watch
#   # failover, breakers and the chart's recovery for real. OFF, and the
#   # /api/marketdata/qa/* endpoints return 404 while it is. For this
#   # repository's own manual QA — there is no reason to enable it in an install
#   # you are trading from.
#   qa_mode: false
#
#   providers:                   # keyless: yahoo, yfinance, stooq
#                                # keyed:   finnhub, twelvedata, alphavantage
#     yahoo:
#       enabled: true
#       priority: 10             # lower is tried first; null keeps the adapter's
#       timeout: null            # null keeps the adapter's own default
#       max_attempts: 2          # tries before failing over (1 = fail over at once)
#       retry_backoff: 0.4
#       min_request_interval: null
#       breaker_threshold: 3     # consecutive failures before leaving rotation
#       breaker_base_cooldown: 15.0
#       breaker_max_cooldown: 300.0
#       min_quality_score: 0.0   # refuse frames validating below this (0-100)
#     stooq:
#       enabled: false           # benched, not deleted: a disabled provider is
#                                # still built and still listed in Settings, so
#                                # it can explain itself and be switched back on
#
#     # ── keyed providers ──────────────────────────────────────────────────
#     # All OPTIONAL. Without a key a provider reports "missing_api_key" in
#     # Help > Diagnostics and is simply never used — the app works exactly as
#     # it does today. Adding one buys a source independent of Yahoo, so a
#     # Yahoo outage stops taking intraday charts with it.
#     #
#     # BEST: paste the key into Settings > Market data. It is stored in a
#     # separate owner-only file, masked in the UI, and never reaches an
#     # export.
#     # ALSO GOOD: the environment — FINNHUB_API_KEY, TWELVEDATA_API_KEY,
#     # ALPHAVANTAGE_API_KEY are read automatically and need no configuration
#     # here. The environment OUTRANKS both this file and a pasted key, so a
#     # variable left set will silently override what you type in the app (the
#     # settings page says so when that is happening).
#     # LEAST GOOD: here. This file is the one people attach to bug reports.
#     # (A key set here IS redacted from every diagnostics export, but keeping
#     # it out of the file entirely is better still.)
#     finnhub:                   # 60 req/min, real-time — finnhub.io/register
#       api_key: null            # or: api_key_env: MY_FINNHUB_VAR
#     twelvedata:                # 800/day, 8/min — twelvedata.com/pricing
#       api_key: null
#     alphavantage:              # 25/DAY, 5/min — alphavantage.co
#       api_key: null
#       # Override the published limits only on a paid plan:
#       # requests_per_day: 1000
#       # requests_per_minute: 75

engine:
  min_confidence: 80        # the conservative bar; also the base for high-risk tiers
  # Trading mode — "conservative" (default) or "high_risk":
  #   conservative: only trade at >= min_confidence. Accuracy over frequency.
  #   high_risk:    the bar adapts to setup quality (excellent 62 / good 70 /
  #                 average 77 with the default base of 80; poor setups never
  #                 trade). Entries below min_confidence also require
  #                 risk/reward >= high_risk_min_rr_stretch. All risk limits,
  #                 stops and position sizing stay fully enforced.
  trading_mode: conservative
  # Operating mode — "ai" (default) or "human":
  #   ai:    the engine places entries itself (through the risk manager) and
  #          manages its own stops/targets.
  #   human: the engine still scans and scores every symbol, but only advises
  #          (one notification per tradeable signal) — YOU place every order
  #          from the Trade tab, and the AI coach reviews each closed trade.
  # Switchable live from the app header; the in-app choice is persisted in
  # data/settings.json and overrides this value on the next start.
  operating_mode: ai
  high_risk_floor: 60           # never trade below this confidence, ever
  high_risk_min_rr_stretch: 2.0 # RR required for below-base-confidence entries
  target_delta: 0.45
  min_dte: 7
  max_dte: 45
  max_spread_pct: 0.10      # reject option spreads wider than 10% of mid
  min_open_interest: 200
  min_option_volume: 50

risk:
  starting_balance: 25000
  risk_per_trade_pct: 1.0
  max_daily_loss_pct: 3.0
  max_weekly_loss_pct: 6.0
  max_drawdown_pct: 15.0
  max_consecutive_losses: 3
  max_contracts: 10
  max_open_positions: 3
  daily_trade_limit: 5
  min_risk_reward: 1.5
  cooldown_minutes_after_loss: 15
  trading_start: "09:45"    # ET — skip opening chop
  trading_end: "15:30"      # ET — no new entries near the close

broker:
  name: paper               # v1: paper only. Live requires explicit two-flag opt-in.
  commission_per_contract: 0.65
  slippage_pct: 0.01

notify:
  desktop: true
  email: false
  daily_summary: true
  weekly_summary: true

# TradingView alerts (inbound webhook). An alert triggers a scan of that
# symbol through the full engine + risk pipeline — it can never place an
# order directly. Alert message format in TradingView:
#   {"secret": "<your secret>", "symbol": "{{ticker}}", "note": "optional"}
# POST it to http://<host>:<port>/webhook/tradingview
integrations:
  tradingview_webhook: false
  tradingview_secret: ""      # required (16+ chars) when enabling the webhook

logging:
  level: INFO
