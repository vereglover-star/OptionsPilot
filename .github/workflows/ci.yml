name: CI

# Runs on every branch push and pull request. Also exposed as a reusable
# workflow (workflow_call) so the Release workflow can gate a tag build on the
# exact same test job — one definition, no drift.
on:
  push:
    branches: ["**"]        # tag pushes (v*) are handled by release.yml, not here
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run (fail fast, save minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & selftest (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Keep the app's storage root off the runner's real profile. Ephemeral
      # anyway, but this makes the selftest's storage init self-contained.
      # Set here (not in job-level env:) because the `runner` context isn't
      # available at workflow-parse time; $GITHUB_ENV exports it to all steps.
      - name: Configure storage root
        shell: pwsh
        run: '"OPTIONSPILOT_HOME=$env:RUNNER_TEMP\OptionsPilot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # project requires >=3.12; matrix can be added later
          cache: pip
          # Both files decide what gets installed now — pyproject.toml which
          # packages, requirements-lock.txt which versions — so both belong in
          # the cache key. Keying on pyproject alone would reuse a stale cache
          # after a lock-only change.
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      # `-c requirements-lock.txt` pins every version to the set the suite was
      # last verified green against. pyproject.toml still decides WHICH
      # packages are installed; the lock only decides which version, so a
      # Windows-only pin is inert on a Linux runner.
      - name: Install project (dev + ui extras, version-locked)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]" -c requirements-lock.txt

      # Lint before the suite: it takes well under a second and a dead import
      # or a shadowed definition should not wait on ~95s of tests to report.
      - name: Lint (ruff)
        run: ruff check optionspilot tests scripts

      # The suite runs WITH coverage here and without it locally: the ratchet
      # (`fail_under` in pyproject.toml) is what turns a test count into a
      # signal, and it is only meaningful if it runs on every change. A drop
      # below the recorded baseline fails the build.
      - name: Run test suite (with coverage ratchet)
        run: pytest --cov --cov-report=term --cov-report=xml

      # Kept even when the suite fails: a coverage drop is far easier to
      # diagnose from the report than from the one-line fail_under message.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: warn

      - name: Selftest (storage layout + lazy-import bundle gate)
        run: python -m optionspilot selftest

      - name: HTML id references resolve
        run: python scripts/check_html_ids.py

      - name: Docs consistency (single-source version, test counts, cross-refs)
        run: python scripts/check_docs.py

      # V0.9.0-C5. This script existed since V0.7.0 and had never been run by
      # anything: not CI, not release.yml, not verify.ps1. docs/PROJECT_STATE.md
      # listed it among the checks that gate a release, which made it worse than
      # absent — it was counted as protection while executing zero times.
      # tests/test_release_tooling.py::TestCheckScriptsAreWired now fails if any
      # check script loses its caller again.
      - name: API v1 contract check
        run: python scripts/api_contract_check.py
