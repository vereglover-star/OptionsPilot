name: CI

# Runs on every branch push and pull request. Also exposed as a reusable
# workflow (workflow_call) so the Release workflow can gate a tag build on the
# exact same test job — one definition, no drift.
on:
  push:
    branches: ["**"]        # tag pushes (v*) are handled by release.yml, not here
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to the same ref cancels the in-flight run (fail fast, save minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & selftest (${{ matrix.os }})
    # V0.9.0-C6. V0.7.0 built `optionspilot/host/` with capability profiles for
    # targets that do not exist yet, and tests/test_architecture.py forbids
    # `sys.platform` branching outside two files — all so a non-Windows host
    # stays possible. None of it was verified anywhere: a WindowsPath
    # assumption or a `winreg` import leaking upward would have merged green.
    # The abstraction was being maintained on faith. This matrix is what turns
    # that faith into a check.
    #
    # Windows remains the CANONICAL baseline: it is what ships, it is where the
    # coverage ratchet is enforced, and it is the only leg that builds an exe.
    # Ubuntu answers one question — does this code still run somewhere that is
    # not Windows — and nothing else.
    strategy:
      # Never cancel one leg because the other failed. A Windows failure and a
      # Linux failure are different pieces of information and we want both.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Keep the app's storage root off the runner's real profile. Ephemeral
      # anyway, but this makes the selftest's storage init self-contained.
      # Set here (not in job-level env:) because the `runner` context isn't
      # available at workflow-parse time; $GITHUB_ENV exports it to all steps.
      #
      # `Join-Path` rather than the previous "$env:RUNNER_TEMP\OptionsPilot":
      # a hardcoded backslash is a path separator on Windows and an ordinary
      # FILENAME CHARACTER on Linux, so the literal version would have created
      # a single directory called "...\OptionsPilot" on the Ubuntu leg. It
      # would not have failed loudly — AppPaths would have used it — which is
      # exactly the class of portability bug this matrix exists to surface.
      - name: Configure storage root
        shell: pwsh
        run: '"OPTIONSPILOT_HOME=$(Join-Path $env:RUNNER_TEMP ''OptionsPilot'')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # project requires >=3.12; matrix can be added later
          cache: pip
          # Both files decide what gets installed now — pyproject.toml which
          # packages, requirements-lock.txt which versions — so both belong in
          # the cache key. Keying on pyproject alone would reuse a stale cache
          # after a lock-only change.
          cache-dependency-path: |
            pyproject.toml
            requirements-lock.txt

      # `-c requirements-lock.txt` pins every version to the set the suite was
      # last verified green against. pyproject.toml still decides WHICH
      # packages are installed; the lock only decides which version, so a
      # Windows-only pin is inert on a Linux runner.
      - name: Install project (dev + ui extras, version-locked)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ui]" -c requirements-lock.txt

      # Lint before the suite: it takes well under a second and a dead import
      # or a shadowed definition should not wait on ~95s of tests to report.
      - name: Lint (ruff)
        run: ruff check optionspilot tests scripts

      # The suite runs WITH coverage here and without it locally: the ratchet
      # (`fail_under` in pyproject.toml) is what turns a test count into a
      # signal, and it is only meaningful if it runs on every change. A drop
      # below the recorded baseline fails the build.
      - name: Run test suite (with coverage ratchet)
        if: matrix.os == 'windows-latest'
        run: pytest --cov --cov-report=term --cov-report=xml

      # Same suite, ratchet DISABLED rather than lowered. The 91% baseline was
      # measured on Windows, and ~408 statements in ui/desktop.py, ui/tray.py
      # and notify/desktop.py are Windows-only paths that cannot execute here.
      # Enforcing the Windows number on Linux would fail this leg on coverage
      # instead of on a defect, and a gate that fires for the wrong reason gets
      # ignored or weakened — usually by lowering the threshold for everyone,
      # which would quietly discard the Windows guarantee too.
      #
      # Coverage is still COLLECTED and printed, so the Linux figure is visible
      # and can become its own baseline later; it is simply not a gate today.
      - name: Run test suite (portability, coverage reported not enforced)
        if: matrix.os != 'windows-latest'
        run: pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=0

      # Kept even when the suite fails: a coverage drop is far easier to
      # diagnose from the report than from the one-line fail_under message.
      # Per-OS artifact name — a shared name collides across matrix legs.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: warn

      - name: Selftest (storage layout + lazy-import bundle gate)
        run: python -m optionspilot selftest

      - name: HTML id references resolve
        run: python scripts/check_html_ids.py

      - name: Docs consistency (single-source version, test counts, cross-refs)
        run: python scripts/check_docs.py

      # V0.9.0-C5. This script existed since V0.7.0 and had never been run by
      # anything: not CI, not release.yml, not verify.ps1. docs/PROJECT_STATE.md
      # listed it among the checks that gate a release, which made it worse than
      # absent — it was counted as protection while executing zero times.
      # tests/test_release_tooling.py::TestCheckScriptsAreWired now fails if any
      # check script loses its caller again.
      - name: API v1 contract check
        run: python scripts/api_contract_check.py
